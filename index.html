function toFS(val){
  if(val===null||val===undefined)return{nullValue:null};
  if(typeof val==="boolean")return{booleanValue:val};
  if(typeof val==="number")return Number.isInteger(val)?{integerValue:String(val)}:{doubleValue:val};
  if(typeof val==="string")return{stringValue:val};
  if(Array.isArray(val))return{arrayValue:{values:val.map(toFS)}};
  if(typeof val==="object"){const f={};Object.entries(val).forEach(([k,v])=>{f[k]=toFS(v);});return{mapValue:{fields:f}};}
  return{stringValue:String(val)};
}
function fromFS(val){
  if(!val)return null;
  if("nullValue"in val)return null;
  if("booleanValue"in val)return val.booleanValue;
  if("integerValue"in val)return Number(val.integerValue);
  if("doubleValue"in val)return val.doubleValue;
  if("stringValue"in val)return val.stringValue;
  if("arrayValue"in val)return(val.arrayValue.values||[]).map(fromFS);
  if("mapValue"in val){const o={};Object.entries(val.mapValue.fields||{}).forEach(([k,v])=>{o[k]=fromFS(v);});return o;}
  return null;
}
async function fbGet(){
  try{const r=await fetch(BASE_URL);if(!r.ok)return null;const d=await r.json();if(!d.fields)return null;const o={};Object.entries(d.fields).forEach(([k,v])=>{o[k]=fromFS(v);});return o;}
  catch{return null;}
}
async function fbSet(data){
  try{const f={};Object.entries(data).forEach(([k,v])=>{f[k]=toFS(v);});await fetch(BASE_URL,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})});return true;}
  catch{return false;}
}

function calcStandings(sessions,players){
  const stats={};
  players.filter(p=>p!=="Avulso").forEach(p=>{stats[p]={name:p,points:0,saldo:0,vitorias:0,top3:0};});
  sessions.forEach(s=>{
    Object.entries(s.pts||{}).forEach(([n,p])=>{if(n!=="Avulso"&&stats[n])stats[n].points=(stats[n].points||0)+p;});
    Object.entries(s.saldos||{}).forEach(([n,v])=>{if(stats[n])stats[n].saldo=(stats[n].saldo||0)+parseFloat(v||0);});
    Object.entries(s.positions||{}).forEach(([n,pos])=>{
      if(!stats[n]||n==="Avulso")return;
      const p=parseInt(pos);
      if(p===1)stats[n].vitorias=(stats[n].vitorias||0)+1;
      if(p<=3)stats[n].top3=(stats[n].top3||0)+1;
    });
  });
  return Object.values(stats).sort((a,b)=>{
    if(b.points!==a.points)return b.points-a.points;          // 1. pontos
    if(b.saldo!==a.saldo)return b.saldo-a.saldo;              // 2. maior saldo
    if(b.vitorias!==a.vitorias)return b.vitorias-a.vitorias;  // 3. mais vitórias
    if(b.top3!==a.top3)return b.top3-a.top3;                  // 4. mais top 3
    return 0;                                                   // 5. sorteio
  });
}
function calcBalance(sessions,players){
  const d={};
  players.forEach(p=>{d[p]={gasto:0,ganhou:0,saldo:0};});
  sessions.forEach(s=>{
    (s.present||[]).forEach(p=>{if(!d[p])d[p]={gasto:0,ganhou:0,saldo:0};d[p].gasto+=parseFloat(s.gastos?.[p]||0);d[p].ganhou+=parseFloat(s.ganhos?.[p]||0);});
    (s.ausentes||[]).forEach(p=>{if(!d[p])d[p]={gasto:0,ganhou:0,saldo:0};d[p].gasto+=BUYIN_AUSENTE;});
  });
  Object.keys(d).forEach(p=>{d[p].saldo=d[p].ganhou-d[p].gasto;});
  return Object.entries(d).map(([name,v])=>({name,...v}));
}

// ── RECALC SESSION ─────────────────────────────────────────
function recalcSession(sess){
  const {present,gastos,positions,bountys,acordoDetails,gastoExtra,ausentes=[]}=sess;
  const posList=Object.entries(positions).sort((a,b)=>parseInt(a[1])-parseInt(b[1]));
  const top3=posList.slice(0,3).map(([n])=>n);
  const tP=present.reduce((s,p)=>s+(parseFloat(gastos[p])||0),0)+ausentes.length*BUYIN_AUSENTE;
  const isNew=bountys&&Object.keys(bountys).length>0&&Object.values(bountys).every(v=>typeof v==="string");
  const tB=isNew?Object.keys(bountys||{}).length*BOUNTY_VALUE:Object.values(bountys||{}).reduce((s,v)=>s+(parseInt(v)||0),0)*BOUNTY_VALUE;
  const tGE=parseFloat(gastoExtra?.valor||0);
  const pL=tP-tB-tGE;
  const pFV=pL*POTE_FINAL_PERCENT;
  const pD=pL*(1-POTE_FINAL_PERCENT);
  const acordoTipo=acordoDetails?.tipo||"padrao";
  const extrasObj=acordoDetails?.extras||{};
  const totalExtras=Object.values(extrasObj).reduce((s,v)=>s+parseFloat(v||0),0);
  const basePercent=acordoTipo==="divisao12"
    ?[{n:top3[0],v:pD*(POTE_PERCENT[0]+POTE_PERCENT[1])/2},{n:top3[1],v:pD*(POTE_PERCENT[0]+POTE_PERCENT[1])/2},{n:top3[2],v:pD*POTE_PERCENT[2]}]
    :acordoTipo==="divisao123"?top3.map(n=>({n,v:pD/3}))
    :top3.map((n,i)=>({n,v:pD*POTE_PERCENT[i]}));
  const tBase=basePercent.reduce((s,x)=>s+x.v,0);
  const g={};present.forEach(p=>g[p]=0);ausentes.forEach(p=>{g[p]=0;});
  if(isNew){Object.entries(bountys||{}).forEach(([,el])=>{g[el]=(g[el]||0)+BOUNTY_VALUE;});}
  else{Object.entries(bountys||{}).forEach(([el,qtd])=>{g[el]=(g[el]||0)+(parseInt(qtd)||0)*BOUNTY_VALUE;});}
  basePercent.forEach(({n,v})=>{if(!n)return;const desc=tBase>0?totalExtras*(v/tBase):0;g[n]=(g[n]||0)+v-desc;});
  Object.entries(extrasObj).forEach(([n,v])=>{if(parseFloat(v||0)>0)g[n]=(g[n]||0)+parseFloat(v);});
  const sl={};present.forEach(p=>{sl[p]=(g[p]||0)-(parseFloat(gastos[p])||0);});
  ausentes.forEach(p=>{sl[p]=-BUYIN_AUSENTE;});
  const regulares=present.filter(p=>p!=="Avulso");
  const ptT=POINTS_TABLE[Math.min(regulares.length,12)]||POINTS_TABLE[12];
  const pts={};
  posList.filter(([n])=>n!=="Avulso").forEach(([n],i)=>{pts[n]=i<ptT.length?ptT[i]:0;});
  if(present.includes("Avulso"))pts["Avulso"]=0;
  ausentes.forEach(p=>{pts[p]=0;});
  return{...sess,ausentes,ganhos:g,saldos:sl,pts,poteFinalVal:pFV,totalPote:tP,totalBounty:tB,gastoExtraTotal:tGE,poteLiquido:pL,poteDistrib:pD};
}

// ── BOUNTY HELPERS ─────────────────────────────────────────
function getBountyPorEl(bountys){
  const r={};if(!bountys)return r;
  const isNew=Object.keys(bountys).length>0&&Object.values(bountys).every(v=>typeof v==="string");
  if(isNew){Object.entries(bountys).forEach(([eliminado,eliminador])=>{if(!r[eliminador])r[eliminador]=[];r[eliminador].push(eliminado);});}
  else{Object.entries(bountys).forEach(([eliminador,qtd])=>{r[eliminador]=Array(parseInt(qtd)||0).fill("?");});}
  return r;
}

function Spark({sessions,name}){
  const pts=sessions.map(s=>s.pts?.[name]||0);
  if(pts.length<2)return null;
  const max=Math.max(...pts,1),w=80,h=24,pad=2;
  const points=pts.map((v,i)=>{const x=pad+i*(w-2*pad)/(pts.length-1);const y=h-pad-(v/max)*(h-2*pad);return`${x},${y}`;}).join(" ");
  return <svg width={w} height={h}><polyline points={points} fill="none" stroke="#000" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/></svg>;
}

  const initExtras=()=>{if(posicoesPosTop3.length===0||extrasSeq.length>0)return;setExtrasSeq([{pos:parseInt(posicoesPosTop3[0][1]),nome:posicoesPosTop3[0][0],valor:0,confirmado:null}]);};
  const confirmarExtra=(idx,recebeu)=>{setExtrasSeq(prev=>{const next=[...prev];next[idx]={...next[idx],confirmado:recebeu};if(recebeu&&idx+1<posicoesPosTop3.length){next.push({pos:parseInt(posicoesPosTop3[idx+1][1]),nome:posicoesPosTop3[idx+1][0],valor:0,confirmado:null});}return next;});};
  const desfazerExtra=idx=>setExtrasSeq(prev=>prev.slice(0,idx));

  const handleSave=()=>{
    const extrasObj=Object.fromEntries(extrasSeq.filter(e=>e.confirmado&&e.valor>0).map(e=>[e.nome,e.valor]));
    const updated={...sess,date:toISO(date),gastos,positions,bountys,gastoExtra:gastoExtra?.confirmado===true?gastoExtra:null,acordoDetails:{tipo:acordoTipo,extras:extrasObj}};
    onSave(recalcSession(updated));
  };

  return(
    <div style={{borderTop:B,padding:"14px 16px",background:"#fffbe6"}}>

        </div>
        {present.map(p=>(
          <div key={p} style={{display:"grid",gridTemplateColumns:"auto 1fr 110px 110px",gap:"6px 10px",alignItems:"center",marginBottom:6}}>
            <Av name={p} size={24}/>
            <span style={{fontWeight:700,fontSize:12}}>{p}</span>
            <input style={{...nb.inp}} type="number" min="1" max={present.length} value={positions[p]||""} onChange={e=>setPositions(prev=>({...prev,[p]:e.target.value}))}/>
            <input style={{...nb.inp}} type="number" min="0" step="10" value={gastos[p]||""} onChange={e=>setGastos(prev=>({...prev,[p]:e.target.value}))}/>
          </div>
        ))}
        {!ok&&<div style={{...nb.tag("#F97B6B"),marginTop:4}}>Posições devem ser únicas.</div>}
      </div>

      <div style={{marginBottom:14}}>
        <div style={nb.label}>Bountys</div>
        {posList.filter(([,pos])=>parseInt(pos)>3).map(([eliminado,pos])=>(
          <div key={eliminado} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <div style={{...nb.tag("#e5e5e5"),minWidth:28,textAlign:"center"}}>{pos}º</div>
            <Av name={eliminado} size={22}/>
            <span style={{flex:1,fontSize:12,fontWeight:700}}>{eliminado} foi elim. por:</span>
            <select style={{...nb.sel,minWidth:130}} value={bountys[eliminado]||""} onChange={e=>{const val=e.target.value;setBountys(prev=>{const next={...prev};if(val)next[eliminado]=val;else delete next[eliminado];return next;})}}>
              <option value="">— ninguém —</option>
              {present.filter(p=>p!==eliminado).map(p=><option key={p} value={p}>{p}</option>)}

        {Object.keys(bountyPorEl).length>0&&(

          </div>
        )}
      </div>

      {/* GASTO EXTRA */}
      <div style={{...nb.cardSm("#fff"),marginBottom:14}}>
        <GastoExtraWidget gastoExtra={gastoExtra} onChange={setGastoExtra}/>

      <div style={{marginBottom:14}}>

// ── PAGE: ACERTO ───────────────────────────────────────────
function PageAcerto({sessions}){
  const sorted=[...sessions].sort((a,b)=>new Date(toISO(b.date))-new Date(toISO(a.date)));
  const [selId,setSelId]=useState(sorted.length?sorted[0].id:null);
  const [copied,setCopied]=useState(false);
  const sess=sessions.find(s=>s.id===selId);
  if(!sessions.length)return <p style={{fontWeight:700}}>Nenhuma partida registrada.</p>;
  const posList=sess?Object.entries(sess.positions||{}).sort((a,b)=>parseInt(a[1])-parseInt(b[1])):[];
  const devedores=posList.filter(([n])=>(sess?.saldos?.[n]||0)<-0.01);
  const credores=posList.filter(([n])=>(sess?.saldos?.[n]||0)>0.01&&n!=="Léo");
  const saldoLeo=sess?.saldos?.["Léo"]||0;
  const bountyPorEl=getBountyPorEl(sess?.bountys);

  const gerarTexto=()=>{
    if(!sess)return"";
    const L=[
      `🃏 *POKER DO BULLYING — ACERTO DA SEMANA*`,
      `📅 Data: ${fmtDate(sess.date)}`,`👥 Jogadores: ${sess.present.length}`,``,
      `💰 *RESUMO DO POTE*`,
      `• Pote total: *${fmt(sess.totalPote)}*`,
    ];
    if(sess.totalBounty>0)L.push(`• Bountys pagos: *${fmt(sess.totalBounty)}*`);
    if(sess.gastoExtra?.valor>0)L.push(`• ${sess.gastoExtra.descricao||"Gasto extra"}: *-${fmt(sess.gastoExtra.valor)}*`);
    L.push(`• Pote líquido: *${fmt(sess.poteLiquido)}*`);
    L.push(`• Reserva pote final (10%): *${fmt(sess.poteFinalVal)}*`);
    L.push(`• Distribuído: *${fmt(sess.poteDistrib)}*`);
    L.push(``);

    const acordoTipo=sess.acordoDetails?.tipo||"padrao";
    const extrasObj=sess.acordoDetails?.extras||{};
    const totalExtrasWA=Object.values(extrasObj).reduce((s,v)=>s+parseFloat(v||0),0);
    if(totalExtrasWA>0){
      L.push(`📋 *DIVISÃO DO POTE*`);
      L.push(`Pote a distribuir: *${fmt(sess.poteDistrib)}*`);L.push(``);
      const top3WA=posList.slice(0,3).map(([n])=>n);
      const basePercWA=acordoTipo==="divisao12"
        ?[{n:top3WA[0],v:sess.poteDistrib*(POTE_PERCENT[0]+POTE_PERCENT[1])/2},{n:top3WA[1],v:sess.poteDistrib*(POTE_PERCENT[0]+POTE_PERCENT[1])/2},{n:top3WA[2],v:sess.poteDistrib*POTE_PERCENT[2]}]
        :acordoTipo==="divisao123"?top3WA.map(n=>({n,v:sess.poteDistrib/3}))
        :top3WA.map((n,i)=>({n,v:sess.poteDistrib*POTE_PERCENT[i]}));
      const tBaseWA=basePercWA.reduce((s,x)=>s+x.v,0);
      const medals=["🥇","🥈","🥉"];
      basePercWA.forEach(({n,v},i)=>{
        if(!n)return;
        const desc=tBaseWA>0?totalExtrasWA*(v/tBaseWA):0;const final=v-desc;
        L.push(`${medals[i]} ${i+1}º _${n}_ — base: ${fmt(v)}`);
        if(desc>0){L.push(`   Desconto extra: -${fmt(desc)}`);L.push(`   Recebe do pote: *${fmt(final)}*`);}
        else L.push(`   Recebe do pote: *${fmt(final)}*`);
        L.push(``);
      });
      Object.entries(extrasObj).forEach(([nome,val])=>{if(parseFloat(val||0)>0){const pos=sess.positions?.[nome]||"?";L.push(`🎁 ${pos}º _${nome}_ (premiação extra): *${fmt(parseFloat(val))}*`);}});
      L.push(``);
    }
    if(Object.keys(bountyPorEl).length>0){
      L.push(`🎯 *BOUNTYS*`);
      Object.entries(bountyPorEl).forEach(([el,elims])=>{const val=elims.length*BOUNTY_VALUE;const nomes=elims.filter(e=>e!=="?").join(", ");if(nomes)L.push(`• _${el}_ eliminou _${nomes}_ → *${fmt(val)}*`);else L.push(`• _${el}_: ${elims.length} eliminação(ões) → *${fmt(val)}*`);});
      L.push(``);
    }
    L.push(`📊 *RESULTADO POR JOGADOR*`);
    posList.forEach(([n,pos])=>{
      const bv=(bountyPorEl[n]||[]).length*BOUNTY_VALUE;
      const ganhouTotal=sess.ganhos?.[n]||0;
      const poteVal=ganhouTotal-bv;
      const sl=sess.saldos?.[n]||0;
      const e=sl>0?"🟢":sl<0?"🔴":"⚪";
      L.push(`${pos}º _${n}_`);
      L.push(`   Gasto: *${fmt(sess.gastos?.[n]||0)}*`);
      if(poteVal>0)L.push(`   Pote: ${fmt(poteVal)}`);
      if(bv>0)L.push(`   Bounty (${(bountyPorEl[n]||[]).length} elim.): ${fmt(bv)}`);
      if(ganhouTotal>0)L.push(`   Total recebido: *${fmt(ganhouTotal)}*`);
      L.push(`   Saldo: ${e} *${fmt(sl)}*`);
      L.push(``);
    });
    L.push(`💳 *PAGAMENTOS — via Léo (tesoureiro)*`);
    devedores.forEach(([n])=>{const sl=sess.saldos?.[n]||0;L.push(`🔴 _${n}_ paga *${fmt(Math.abs(sl))}* ao Léo`);});
    credores.forEach(([n])=>{const sl=sess.saldos?.[n]||0;L.push(`🟢 Léo paga *${fmt(sl)}* para _${n}_`);});
    return L.join("\n");
  };

  const copiar=()=>{
    const t=gerarTexto();
    const el=document.createElement("textarea");el.value=t;el.style.position="fixed";el.style.opacity="0";
    document.body.appendChild(el);el.focus();el.select();
    try{document.execCommand("copy");setCopied(true);setTimeout(()=>setCopied(false),2500);}catch{alert(t);}
    document.body.removeChild(el);
  };

  return(<div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:8}}>
      <div style={nb.title}>Acerto da Semana</div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <select style={nb.sel} value={selId||""} onChange={e=>setSelId(Number(e.target.value))}>
          {sorted.map(s=><option key={s.id} value={s.id}>{fmtDate(s.date)} — {s.present.length} jog.</option>)}
        </select>
        <button style={nb.btn("#4FC9A4")} onClick={copiar}>{copied?"✓ Copiado!":"⎘ WhatsApp"}</button>
      </div>
    </div>
    {sess&&(<>
      <div className="grid-4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:12}}>
        <StatCard label="Pote Total" value={fmt(sess.totalPote)} bg="#fff"/>
        <StatCard label="Bountys" value={fmt(sess.totalBounty||0)} bg="#FBBF24"/>
        <StatCard label="Distribuído" value={fmt(sess.poteDistrib)} bg="#fff"/>
        <StatCard label="Pote Final 10%" value={fmt(sess.poteFinalVal)} bg="#7C6FF7"/>
      </div>
      {sess.gastoExtra?.valor>0&&(
        <div style={{...nb.cardSm("#F97B6B"),marginBottom:12,display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:16}}>🧾</span>
          <span style={{fontWeight:900,fontSize:13}}>Gasto extra: {sess.gastoExtra.descricao||"—"}</span>
          <span style={{fontWeight:900,fontSize:13,marginLeft:"auto"}}>{fmt(sess.gastoExtra.valor)}</span>
        </div>
      )}
      <div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={nb.card()}>
          <div style={{...nb.label,fontSize:12,marginBottom:12}}>Resultado</div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{borderBottom:B}}>{["Pos.","Jogador","Gasto","Ganhou","Saldo"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left",fontWeight:900,fontSize:10,textTransform:"uppercase"}}>{h}</th>)}</tr></thead>
            <tbody>
              {posList.map(([n,pos],i)=>{const sl=sess.saldos?.[n]||0;const pN=parseInt(pos);return(
                <tr key={n} style={{borderBottom:"2px dashed #ccc",background:i%2===0?"#fff":"#faf8f4"}}>
                  <td style={{padding:"8px"}}><span style={nb.tag(pN===1?"#FBBF24":pN===2?"#d1d5db":pN===3?"#FB923C":"#e5e5e5")}>{pos}</span></td>

// ── PAGE: NOVA PARTIDA ─────────────────────────────────────
function PageNova({players,onSave}){
  const [step,setStep]=useState(1);
  const [date,setDate]=useState(fmtDate(new Date().toISOString().slice(0,10)));
  const [clickOrder,setClickOrder]=useState([]);
  const [ausentes,setAusentes]=useState([]);
  const [gastos,setGastos]=useState({});
  const [positions,setPositions]=useState({});
  const [bountys,setBountys]=useState({});
  const [gastoExtra,setGastoExtra]=useState(null);
  const [acordoTop3,setAcordoTop3]=useState("padrao");
  const [extrasSeq,setExtrasSeq]=useState([]);
  const [ordemInvertida,setOrdemInvertida]=useState(false);

  const present=clickOrder;
  const calcPositions=(order,inv)=>{const pos={};if(inv){const t=order.length;order.forEach((p,i)=>{pos[p]=t-i;});}else{order.forEach((p,i)=>{pos[p]=i+1;});}return pos;};
  const tP=present.reduce((s,p)=>s+(parseFloat(gastos[p])||0),0)+ausentes.length*BUYIN_AUSENTE;
  const tB=Object.keys(bountys).length*BOUNTY_VALUE;
  const tGE=parseFloat(gastoExtra?.valor||0);
  const pL=tP-tB-tGE;
  const pFV=pL*POTE_FINAL_PERCENT;
  const pD=pL*(1-POTE_FINAL_PERCENT);
  const posList=Object.entries(positions).sort((a,b)=>parseInt(a[1])-parseInt(b[1]));
  const top3=posList.slice(0,3).map(([n])=>n);
  const posicoesPosTop3=posList.slice(3);

  const tog=p=>{
    if(ausentes.includes(p)){
      setAusentes(prev=>prev.filter(x=>x!==p));
    } else if(clickOrder.includes(p)){
      setClickOrder(prev=>prev.filter(x=>x!==p));
      setAusentes(prev=>[...prev,p]);
      setGastos(prev=>{const nx={...prev};delete nx[p];return nx;});
      setBountys(prev=>{const nx={...prev};delete nx[p];Object.keys(nx).forEach(k=>{if(nx[k]===p)delete nx[k];});return nx;});
    } else {
      setClickOrder(prev=>[...prev,p]);
    }
  };
  const avancarPasso2=()=>{setPositions(calcPositions(clickOrder,ordemInvertida));setStep(2);};
  const ok1=date&&present.length>=2&&present.every(p=>{const v=gastos[p];return v!==undefined&&v!==""&&parseFloat(v)>0;});
  const ok2=present.every(p=>positions[p]&&parseInt(positions[p])>0)&&new Set(Object.values(positions)).size===present.length;
  const ok3=gastoExtra!==null;
  const bountyPorEl=getBountyPorEl(bountys);
  const totalExtras=extrasSeq.filter(e=>e.confirmado&&e.valor>0).reduce((s,e)=>s+e.valor,0);
  const getBaseTop3=()=>{
    const t3=top3.filter(n=>n);
    if(acordoTop3==="padrao")return t3.map((n,i)=>({n,v:pD*(POTE_PERCENT[i]||0)}));
    if(acordoTop3==="divisao12"){const sh=pD*(POTE_PERCENT[0]+POTE_PERCENT[1])/2;return [{n:t3[0],v:sh},{n:t3[1],v:sh},{n:t3[2],v:pD*POTE_PERCENT[2]}].filter(x=>x.n);}
    if(acordoTop3==="divisao123"){const sh=pD/Math.max(t3.length,1);return t3.map(n=>({n,v:sh}));}
    return [];
  };
  const initExtras=()=>{
    if(posicoesPosTop3.length===0)return;
    const primeiro=posicoesPosTop3[0];
    setExtrasSeq([{pos:parseInt(primeiro[1]),nome:primeiro[0],valor:0,confirmado:null}]);
  };
  const confirmarExtra=(idx,rec,ppt)=>{
    setExtrasSeq(prev=>{
      const next=[...prev];
      next[idx]={...next[idx],confirmado:rec};
      if(rec&&idx+1<ppt.length){
        next.push({pos:parseInt(ppt[idx+1][1]),nome:ppt[idx+1][0],valor:0,confirmado:null});
      }
      return next;
    });
  };
  const desfazerExtra=idx=>setExtrasSeq(prev=>prev.slice(0,idx));
  const calc=()=>{
    const base=getBaseTop3();
    const tBase=base.reduce((s,x)=>s+x.v,0);
    const g={};present.forEach(p=>g[p]=0);ausentes.forEach(p=>{g[p]=0;});
    Object.entries(bountys).forEach(([,eliminador])=>{if(eliminador)g[eliminador]=(g[eliminador]||0)+BOUNTY_VALUE;});
    base.forEach(({n,v})=>{if(!n)return;const desc=tBase>0?totalExtras*(v/tBase):0;g[n]=(g[n]||0)+v-desc;});
    extrasSeq.filter(e=>e.confirmado&&e.valor>0).forEach(e=>{g[e.nome]=(g[e.nome]||0)+e.valor;});
    const sl={};present.forEach(p=>{sl[p]=(g[p]||0)-(parseFloat(gastos[p])||0);});
    ausentes.forEach(p=>{sl[p]=-BUYIN_AUSENTE;});
    const regulares=present.filter(p=>p!=="Avulso");
    const ptT=POINTS_TABLE[Math.min(regulares.length,12)]||POINTS_TABLE[12];
    const pts={};posList.filter(([n])=>n!=="Avulso").forEach(([n],i)=>{pts[n]=i<ptT.length?ptT[i]:0;});
    if(present.includes("Avulso"))pts["Avulso"]=0;
    ausentes.forEach(p=>{pts[p]=0;});
    return{ganhos:g,saldos:sl,pts,poteFinalVal:pFV,totalPote:tP,totalBounty:tB,gastoExtraTotal:tGE,poteLiquido:pL,poteDistrib:pD};
  };
  const STEPS=["Jogadores + Gastos","Posicoes","Gasto Extra","Acordo","Resumo"];

  return(<div>
    <div style={{marginBottom:20}}><div style={nb.title}>Nova Partida</div></div>
    <div style={{maxWidth:520}} className="step-max">
      <div style={{display:"flex",gap:4,marginBottom:8}}>{STEPS.map((s,i)=><div key={s} style={{flex:1,height:6,border:"2px solid #000",borderRadius:2,background:i<step-1?"#000":i===step-1?"#7C6FF7":"#e5e5e5"}}/>)}</div>
      <div style={{...nb.tag("#FBBF24"),marginBottom:14}}>Passo {step}/{STEPS.length} — {STEPS[step-1]}</div>

      {step===1&&<div style={nb.card()}>
        <div style={{marginBottom:14}}><label style={nb.label}>Data (DD/MM/AAAA)</label><input style={{...nb.inp,width:160}} value={date} onChange={e=>setDate(e.target.value)} placeholder="DD/MM/AAAA"/></div>

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"10px 12px",border:B,borderRadius:R,background:ordemInvertida?"#000":"#fff",boxShadow:SH_SM,cursor:"pointer"}} onClick={()=>setOrdemInvertida(v=>!v)}>
          <div style={{width:32,height:18,borderRadius:9,background:ordemInvertida?"#7C6FF7":"#e5e5e5",border:"2px solid #000",position:"relative",flexShrink:0}}>
            <div style={{width:12,height:12,borderRadius:"50%",background:"#000",position:"absolute",top:"3px",left:ordemInvertida?"17px":"3px",transition:"left 0.15s"}}/>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:900,color:ordemInvertida?"#fff":"#000",textTransform:"uppercase",letterSpacing:0.5}}>{ordemInvertida?"Invertido: 1° clique = ultimo colocado":"Normal: 1° clique = 1° lugar"}</div>
            <div style={{fontSize:10,fontWeight:700,color:ordemInvertida?"#aaa":"#555"}}>{ordemInvertida?"Posicoes calculadas ao avancar":"Clique do vencedor para o eliminado"}</div>
          </div>
        </div>

        <div style={{...nb.cardSm(ordemInvertida?"#7C6FF7":"#FBBF24"),marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:900,color:ordemInvertida?"#fff":"#000"}}>{ordemInvertida?"1 clique = 1 eliminado · 2 cliques = FALTOU (R$40) · 3 cliques = remove":"1 clique = 1 lugar · 2 cliques = FALTOU (R$40) · 3 cliques = remove"}</div>
        </div>

        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
          {players.map(p=>{
            const idx=clickOrder.indexOf(p);
            const ausente=ausentes.includes(p);
            const sel=idx>=0;
            const bg=ausente?"#FBBF24":sel?playerColor(p):"#fff";
            return(<button key={p} onClick={()=>tog(p)} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"6px 10px",background:bg,border:B,borderRadius:R,boxShadow:SH_SM,cursor:"pointer",fontSize:11,fontWeight:900,color:"#000",textTransform:"uppercase",letterSpacing:0.5}}>
              {sel&&!ausente&&<span style={{background:"#000",color:bg,borderRadius:2,padding:"1px 5px",fontSize:10,fontWeight:900}}>{ordemInvertida?`${idx+1}e`:`${idx+1}`}</span>}
              {ausente&&<span style={{background:"#000",color:"#FBBF24",borderRadius:2,padding:"1px 5px",fontSize:10,fontWeight:900}}>FALTOU</span>}
              {p}
            </button>);
          })}
        </div>

        {clickOrder.length>0&&(
          <div style={{...nb.cardSm("#f0ebe0"),marginBottom:10}}>
            <div style={{...nb.label,marginBottom:8}}>{ordemInvertida?"Ordem (posicoes calculadas ao avancar):":"Jogadores e gastos:"}</div>
            {clickOrder.map((p,i)=>(
              <div key={p} style={{borderBottom:"2px dashed #ddd",paddingBottom:10,marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{...nb.tag(ordemInvertida?"#7C6FF7":playerColor(p)),minWidth:40,textAlign:"center",fontSize:10}}>{ordemInvertida?`${i+1}e`:`${i+1}°`}</span>
                  <Av name={p} size={22}/>
                  <span style={{flex:1,fontSize:12,fontWeight:900}}>{p}</span>
                  <span style={{fontWeight:900,fontSize:11}}>R$</span>
                  <input
                    style={{...nb.inp,width:70}}
                    type="number" min="1" step="10" placeholder="0"
                    value={gastos[p]!==undefined?gastos[p]:""}
                    onChange={e=>setGastos(prev=>({...prev,[p]:e.target.value}))}
                  />
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:10,fontWeight:900,color:"#555",minWidth:40,flexShrink:0}}>Elim. por:</span>
                  <select
                    style={{...nb.sel,flex:1,fontSize:11,minWidth:0}}
                    value={bountys[p]||""}
                    onChange={e=>{const v=e.target.value;setBountys(prev=>{const nx={...prev};if(v)nx[p]=v;else delete nx[p];return nx;})}}
                  >
                    <option value="">— ninguem —</option>
                    {clickOrder.filter(x=>x!==p).map(x=><option key={x} value={x}>{x}</option>)}
                  </select>
                </div>
              </div>
            ))}
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {tP-ausentes.length*BUYIN_AUSENTE>0&&<span style={nb.tag("#4FC9A4")}>Pote: {fmt(tP-ausentes.length*BUYIN_AUSENTE)}</span>}
              {tB>0&&<span style={nb.tag("#FBBF24")}>Bountys: {fmt(tB)}</span>}
            </div>
          </div>
        )}

        {ausentes.length>0&&(
          <div style={{...nb.cardSm("#FBBF24"),marginBottom:10}}>
            <div style={{...nb.label,marginBottom:4}}>Faltaram — pagam R$40 cada:</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:4}}>
              {ausentes.map(p=><span key={p} style={{...nb.tag("#000"),color:"#FBBF24"}}>✕ {p}</span>)}
            </div>
            <div style={{fontSize:11,fontWeight:900}}>Multa: {fmt(ausentes.length*BUYIN_AUSENTE)}</div>
          </div>
        )}

        {present.length>0&&!ok1&&(
          <div style={{...nb.tag("#F97B6B"),marginBottom:10,display:"block"}}>
            {present.some(p=>!gastos[p]||gastos[p]===""||parseFloat(gastos[p])<=0)
              ?"Preencha o valor gasto de todos os jogadores (min R$1)."
              :"Selecione pelo menos 2 jogadores."}
          </div>
        )}

        <button style={{...nb.btn("#7C6FF7"),opacity:ok1?1:0.5}} onClick={()=>{if(ok1)avancarPasso2();}}>Proximo →</button>
      </div>}

      {step===2&&<div style={nb.card()}>
        <div style={{fontSize:11,fontWeight:700,color:"#555",marginBottom:12}}>{ordemInvertida?"Posicoes calculadas pela ordem invertida. Ajuste se necessario.":"Posicoes pela ordem de selecao. Ajuste se necessario."}</div>
        {posList.map(([p,pos])=>(
          <div key={p} className="nova-row-edit" style={{display:"grid",gridTemplateColumns:"auto 1fr auto",gap:"6px 8px",alignItems:"center",marginBottom:8}}>
            <Av name={p}/><span style={{fontSize:13,fontWeight:700}}>{p}</span>
            <input style={{...nb.inp,width:70}} type="number" min="1" max={present.length} value={positions[p]||""} onChange={e=>setPositions(prev=>({...prev,[p]:e.target.value}))}/>
          </div>
        ))}
        {!ok2&&<div style={{...nb.tag("#F97B6B"),marginBottom:8}}>Posicoes devem ser unicas.</div>}
        <div style={{display:"flex",gap:6,marginTop:10}}><button style={nb.btn()} onClick={()=>setStep(1)}>Voltar</button><button style={nb.btn("#7C6FF7")} onClick={()=>setStep(3)} disabled={!ok2}>Proximo</button></div>
      </div>}

      {step===3&&<div style={nb.card()}>
        <GastoExtraWidget gastoExtra={gastoExtra} onChange={setGastoExtra}/>
        {gastoExtra!==null&&(<div style={{...nb.cardSm("#e5e5e5"),marginTop:12}}>
          <div style={{fontSize:11,fontWeight:700,lineHeight:1.8}}>
            Pote total: {fmt(tP)}<br/>
            {tB>0&&<>(-) Bountys: {fmt(tB)}<br/></>}
            {tGE>0&&<>(-) {gastoExtra?.descricao||"Gasto extra"}: {fmt(tGE)}<br/></>}
            = Pote liquido: {fmt(pL)}<br/>
            (-) Pote final 10%: {fmt(pFV)}<br/>
            = Pote a distribuir: {fmt(pD)}
          </div>
        </div>)}
        <div style={{display:"flex",gap:6,marginTop:14}}><button style={nb.btn()} onClick={()=>setStep(2)}>Voltar</button><button style={nb.btn("#7C6FF7")} onClick={()=>{initExtras();setStep(4);}} disabled={!ok3}>Proximo</button></div>
      </div>}

      {step===4&&(()=>{
        const base4=getBaseTop3();
        const tBase4=base4.reduce((s,x)=>s+x.v,0);
        const ppt=posicoesPosTop3;
        return(<div style={nb.card()}>
          <div style={{fontWeight:900,marginBottom:4}}>Pote a distribuir: {fmt(pD)}</div>
          <div style={{fontWeight:700,color:"#555",marginBottom:12,fontSize:11}}>Top 3: {top3.filter(n=>n).join(", ")||"—"}</div>
          <div style={{...nb.label,marginBottom:8}}>Divisao do top 3:</div>
          {[{id:"padrao",label:"Padrao: 40% / 30% / 20%"},{id:"divisao12",label:"Acordo 1 e 2 + 3 20%"},{id:"divisao123",label:"Acordo 3 dividem igual"}].map(o=>(
            <div key={o.id}
              onClick={()=>setAcordoTop3(o.id)}
              style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",border:B,borderRadius:R,cursor:"pointer",fontSize:12,fontWeight:700,marginBottom:6,background:acordoTop3===o.id?"#7C6FF7":"#fff",boxShadow:SH_SM,userSelect:"none"}}>
              <div style={{width:16,height:16,borderRadius:"50%",border:"3px solid #000",background:acordoTop3===o.id?"#000":"transparent",flexShrink:0}}/>
              {o.label}
            </div>
          ))}
          {ppt.length>0&&(<div style={{marginTop:14}}>
            <div style={{...nb.label,marginBottom:8}}>Premiacao extra:</div>
            {extrasSeq.map((e,idx)=>(
              <div key={idx} style={{...nb.cardSm("#f0ebe0"),marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:e.confirmado===true?8:0}}>
                  <div style={{...nb.tag("#e5e5e5"),minWidth:28,textAlign:"center"}}>{e.pos}°</div>
                  <Av name={e.nome} size={22}/>
                  <span style={{flex:1,fontSize:12,fontWeight:700}}>{e.nome} recebeu premiacao?</span>
                  {e.confirmado===null&&(
                    <div style={{display:"flex",gap:6}}>
                      <button style={nb.btn("#4FC9A4")} onClick={()=>confirmarExtra(idx,true,ppt)}>Sim</button>
                      <button style={nb.btn("#F97B6B")} onClick={()=>confirmarExtra(idx,false,ppt)}>Nao</button>
                    </div>
                  )}
                  {e.confirmado!==null&&<button style={{...nb.btn(),fontSize:10,padding:"4px 8px"}} onClick={()=>desfazerExtra(idx)}>✕</button>}
                </div>
                {e.confirmado===true&&(
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontWeight:900}}>R$</span>
                    <input style={{...nb.inp,width:100}} type="number" min="0" value={e.valor||""} onChange={ev=>setExtrasSeq(prev=>{const next=[...prev];next[idx]={...next[idx],valor:parseFloat(ev.target.value)||0};return next;})}/>
                    {e.valor>0&&<span style={nb.tag("#FBBF24")}>{fmt(e.valor)}</span>}
                  </div>
                )}
                {e.confirmado===false&&<div style={{fontSize:11,fontWeight:700,color:"#555",marginTop:4}}>Sem premiacao extra.</div>}
              </div>
            ))}
            {extrasSeq.length===0&&<button style={nb.btn("#FBBF24")} onClick={initExtras}>+ Verificar premiacao extra</button>}
          </div>)}
          {totalExtras>0&&tBase4>0&&(
            <div style={{...nb.cardSm("#e5e5e5"),marginTop:10}}>
              <div style={{fontWeight:900,marginBottom:6}}>Desconto proporcional top 3:</div>
              {base4.map(({n,v})=>{
                if(!n)return null;
                const desc=totalExtras*(v/tBase4);
                return(<div key={n} style={{fontSize:11,fontWeight:700,marginBottom:3}}>{n}: {fmt(v)} - {fmt(desc)} = <strong>{fmt(v-desc)}</strong></div>);
              })}
            </div>
          )}
          <div style={{display:"flex",gap:6,marginTop:14}}>
            <button style={nb.btn()} onClick={()=>setStep(3)}>Voltar</button>
            <button style={nb.btn("#7C6FF7")} onClick={()=>setStep(5)}>Ver resumo</button>
          </div>
        </div>);
      })()}

      {step===5&&(()=>{
        const res=calc();
        return(<div style={nb.card()}>
          <div className="grid-3" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
            <div style={nb.cardSm()}><div style={nb.label}>Pote total</div><div style={{fontWeight:900}}>{fmt(res.totalPote)}</div></div>
            <div style={nb.cardSm("#7C6FF7")}><div style={nb.label}>Pote Final 10%</div><div style={{fontWeight:900}}>{fmt(res.poteFinalVal)}</div></div>
            <div style={nb.cardSm()}><div style={nb.label}>Distribuido</div><div style={{fontWeight:900}}>{fmt(res.poteDistrib)}</div></div>
          </div>
          {tGE>0&&<div style={{...nb.cardSm("#F97B6B"),marginBottom:12}}><span style={{fontWeight:900}}>Gasto extra ({gastoExtra?.descricao}): {fmt(tGE)}</span></div>}
          {ausentes.length>0&&<div style={{...nb.cardSm("#FBBF24"),marginBottom:12}}><span style={{fontWeight:900}}>FALTARAM: {ausentes.join(", ")} - multa {fmt(ausentes.length*BUYIN_AUSENTE)}</span></div>}
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,marginBottom:12}}>
            <thead><tr style={{borderBottom:B}}>{["Jogador","Pos.","Gasto","Ganhou","Saldo","Pts"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left",fontWeight:900,fontSize:10,textTransform:"uppercase"}}>{h}</th>)}</tr></thead>
            <tbody>{posList.map(([n,pos],i)=>{const sl=res.saldos[n];return(<tr key={n} style={{borderBottom:"2px dashed #ccc",background:i%2===0?"#fff":"#faf8f4"}}><td style={{padding:"8px"}}><div style={{display:"flex",alignItems:"center",gap:6}}><Av name={n} size={22}/><span style={{fontWeight:900}}>{n}</span></div></td><td style={{padding:"8px"}}><span style={nb.tag("#e5e5e5")}>{pos}</span></td><td style={{padding:"8px",fontWeight:700,color:"#555"}}>{fmt(gastos[n]||0)}</td><td style={{padding:"8px",fontWeight:700}}>{fmt(res.ganhos[n]||0)}</td><td style={{padding:"8px"}}><span style={nb.tag(sl>=0?"#4FC9A4":"#F97B6B")}>{fmt(sl)}</span></td><td style={{padding:"8px",fontWeight:700,color:"#555"}}>{n!=="Avulso"?fmtPts(res.pts[n]||0):"?"}</td></tr>);})}</tbody>
          </table>
          <div style={{display:"flex",gap:6}}>
            <button style={nb.btn()} onClick={()=>setStep(4)}>Voltar</button>
            <button style={nb.btn("#4FC9A4")} onClick={()=>{const r=calc();onSave({id:Date.now(),date:toISO(date),present,ausentes,gastos,positions,bountys,gastoExtra:gastoExtra?.confirmado===true?gastoExtra:null,acordoDetails:{tipo:acordoTop3,extras:Object.fromEntries(extrasSeq.filter(e=>e.confirmado&&e.valor>0).map(e=>[e.nome,e.valor]))},totalBounty:tB,...r});}}>Salvar partida</button>
          </div>
        </div>);
      })()}
    </div>
  </div>);
}
// ── PAGE: AUDITORIA ────────────────────────────────────────
function PageAuditoria({sessions,players}){
  const [expanded,setExpanded]=useState(null);
  const [filterPlayer,setFilterPlayer]=useState("todos");
  const [copied,setCopied]=useState(null);
  const sorted=[...sessions].sort((a,b)=>new Date(toISO(a.date))-new Date(toISO(b.date)));
  const standingsAt=(idx)=>calcStandings(sorted.slice(0,idx),players);
  const getAudit=(sess,idx)=>{
    const before=standingsAt(idx);const after=standingsAt(idx+1);
    const regulares=(sess.present||[]).filter(p=>p!=="Avulso"&&!(sess.ausentes||[]).includes(p));
    const n=Math.min(regulares.length,12);const tabela=POINTS_TABLE[n]||POINTS_TABLE[12];
    return players.filter(p=>p!=="Avulso").map(p=>{
      const ausente=(sess.ausentes||[]).includes(p);
      const presente=(sess.present||[]).includes(p)&&!ausente;
      const pos=sess.positions?.[p];const ptsGanhos=sess.pts?.[p]||0;
      const rankBefore=(before.findIndex(s=>s.name===p)+1)||0;
      const rankAfter=(after.findIndex(s=>s.name===p)+1)||0;
      const ptsBefore=before.find(s=>s.name===p)?.points||0;
      const ptsAfter=after.find(s=>s.name===p)?.points||0;
      const delta=rankBefore&&rankAfter?rankBefore-rankAfter:0;
      return{name:p,ausente,presente,pos,ptsGanhos,tabela,n,rankBefore,rankAfter,ptsBefore,ptsAfter,delta};
    });
  };

  const gerarTextoAuditoria=(sess,idx)=>{
    const audit=getAudit(sess,idx);
    const regulares=(sess.present||[]).filter(p=>p!=="Avulso"&&!(sess.ausentes||[]).includes(p));
    const n=Math.min(regulares.length,12);
    const tabela=POINTS_TABLE[n]||POINTS_TABLE[12];
    const posList=Object.entries(sess.positions||{}).sort((a,b)=>parseInt(a[1])-parseInt(b[1]));
    const winner=posList[0]?.[0]||"—";
    const L=[];
    L.push(`🔍 *AUDITORIA — Poker do Bullying*`);
    L.push(`📅 Data: ${fmtDate(sess.date)}`);
    L.push(`🏆 Vencedor: _${winner}_`);
    L.push(`👥 Mesa: ${regulares.length} jogadores regulares → tabela de ${n}`);
    L.push(``);
    L.push(`📊 *TABELA DO DIA (${n} jogadores)*`);
    L.push(tabela.map((v,i)=>`${i+1}°=${fmtPts(v)}`).join(" · "));
    L.push(``);
    L.push(`📈 *RESULTADO E PONTUAÇÃO*`);
    posList.forEach(([name,pos])=>{
      const a=audit.find(x=>x.name===name);
      if(!a||!a.presente)return;
      const motivo=a.pos&&a.pos<=tabela.length?`${a.pos}° em mesa de ${n} → ${fmtPts(tabela[a.pos-1])} pts`:"fora da tabela";
      const dirRanking=a.delta>0?"↑":a.delta<0?"↓":"→";
      const mudanca=a.delta!==0?` (${dirRanking}${Math.abs(a.delta)})`:` (sem mudança)`;
      L.push(`${pos}° _${name}_ — *${fmtPts(a.ptsGanhos)} pts*`);
      L.push(`   Motivo: ${motivo}`);
      L.push(`   Ranking: ${a.rankBefore||"—"}° → ${a.rankAfter||"—"}°${mudanca}`);
      L.push(`   Acumulado: ${fmtPts(a.ptsBefore)} → *${fmtPts(a.ptsAfter)} pts*`);
      L.push(``);
    });
    if((sess.ausentes||[]).length>0){
      L.push(`⚠️ *FALTARAM (0 pts, ranking congelado)*`);
      (sess.ausentes||[]).forEach(p=>{
        const a=audit.find(x=>x.name===p);
        L.push(`✕ _${p}_ — ranking mantido em ${a?.rankAfter||"—"}° | ${fmtPts(a?.ptsAfter||0)} pts acum.`);
      });
    }
    return L.join("\n");
  };

  const copiar=(sess,idx)=>{
    const txt=gerarTextoAuditoria(sess,idx);
    const el=document.createElement("textarea");el.value=txt;el.style.position="fixed";el.style.opacity="0";
    document.body.appendChild(el);el.focus();el.select();
    try{document.execCommand("copy");setCopied(sess.id);setTimeout(()=>setCopied(null),2500);}catch{alert(txt);}
    document.body.removeChild(el);
  };
  return(<div>
    <div style={{marginBottom:20}}><div style={nb.title}>Auditoria</div><div style={nb.sub}>Transparencia de pontos e ranking por partida</div></div>
    <div style={{...nb.card(),marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
      <label style={nb.label}>Filtrar jogador:</label>
      <select style={nb.sel} value={filterPlayer} onChange={e=>setFilterPlayer(e.target.value)}>
        <option value="todos">Todos os jogadores</option>
        {players.filter(p=>p!=="Avulso").map(p=><option key={p} value={p}>{p}</option>)}
      </select>
      {filterPlayer!=="todos"&&<div style={{display:"flex",alignItems:"center",gap:8,marginLeft:8}}><Av name={filterPlayer} size={26}/><span style={{fontWeight:900,fontSize:13}}>{filterPlayer}</span></div>}
    </div>
    {sorted.map((sess,idx)=>{
      const audit=getAudit(sess,idx);
      const filtered=filterPlayer==="todos"?audit:audit.filter(a=>a.name===filterPlayer);
      const visible=filtered.filter(a=>a.presente||a.ausente);
      if(filterPlayer!=="todos"&&visible.length===0)return null;
      const isExp=expanded===sess.id;
      const winner=Object.entries(sess.positions||{}).find(([,v])=>v==1)?.[0]||"—";
      const regulares=(sess.present||[]).filter(p=>p!=="Avulso"&&!(sess.ausentes||[]).includes(p));
      const n=Math.min(regulares.length,12);const tabela=POINTS_TABLE[n]||POINTS_TABLE[12];

        <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",cursor:"pointer",background:isExp?"#f0ebe0":"#fff"}} onClick={()=>setExpanded(isExp?null:sess.id)}>
          <div style={{background:"#FBBF24",border:B,borderRadius:2,padding:"4px 10px",textAlign:"center",boxShadow:"2px 2px 0 #000",flexShrink:0}}>
            <div style={{fontSize:10,fontWeight:900}}>{fmtDate(sess.date).slice(3,10)}</div>
            <div style={{fontSize:16,fontWeight:900}}>{fmtDate(sess.date).slice(0,2)}</div>
          </div>
          <Av name={winner}/>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:900}}>{winner} venceu</div>
            <div style={{fontSize:11,fontWeight:700,color:"#555"}}>{regulares.length} regulares · tabela de {n} · {fmtDate(sess.date)}</div>
          </div>
          <span style={{fontWeight:900,fontSize:16}}>{isExp?"▲":"▼"}</span>
        </div>
        {isExp&&(<div style={{borderTop:B,padding:"14px 16px",background:"#faf8f4"}}>
          <div style={{...nb.cardSm("#7C6FF7"),marginBottom:14}}>
            <div style={{...nb.label,marginBottom:8,color:"#000"}}>Tabela aplicada — {n} jogadores regulares</div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {tabela.map((v,i)=>(<div key={i} style={{background:"#fff",border:B,borderRadius:2,padding:"4px 8px",textAlign:"center",boxShadow:"2px 2px 0 #000",minWidth:44}}><div style={{fontSize:9,fontWeight:900,color:"#555"}}>{i+1}°</div><div style={{fontSize:12,fontWeight:900}}>{fmtPts(v)}</div></div>))}
            </div>
          </div>
          {visible.map(a=>(<div key={a.name} style={{...nb.card(),marginBottom:10,padding:"12px 14px"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:a.presente?10:0}}>
              <Av name={a.name} size={28}/>
              <span style={{fontWeight:900,fontSize:14,flex:1}}>{a.name}</span>
              {a.ausente&&<span style={nb.tag("#FBBF24")}>FALTOU</span>}
              {a.presente&&<div style={{display:"flex",gap:6}}><span style={nb.tag("#e5e5e5")}>{a.pos}° lugar</span><span style={nb.tag("#7C6FF7")}>{fmtPts(a.ptsGanhos)} pts</span></div>}
            </div>
            {a.ausente&&<div style={{paddingLeft:36,fontSize:11,fontWeight:700,color:"#555"}}>Nao jogou · paga R$40 de multa · recebe 0 pontos · ranking congelado</div>}
            {a.presente&&(<div style={{paddingLeft:36}}>
              <div style={{...nb.cardSm("#f0ebe0"),marginBottom:8,padding:"8px 10px"}}>
                <div style={{fontSize:11,fontWeight:900,marginBottom:4}}>Por que {fmtPts(a.ptsGanhos)} pts?</div>
                <div style={{display:"flex",gap:6,marginBottom:6,flexWrap:"wrap"}}>
                  <span style={nb.tag("#e5e5e5")}>Acumulado antes: {fmtPts(a.ptsBefore)} pts</span>
                  <span style={nb.tag("#7C6FF7")}>+ {fmtPts(a.ptsGanhos)} pts esta rodada</span>
                  <span style={nb.tag("#4FC9A4")}>{fmtPts(a.ptsAfter)} pts total</span>
                </div>
                {a.pos&&a.pos<=a.tabela.length?(<div style={{fontSize:11,fontWeight:700,color:"#333",lineHeight:1.6}}>{a.pos}° lugar em mesa de {a.n} jogadores regulares<br/>Tabela de {a.n}: posicao {a.pos} = <strong>{fmtPts(a.tabela[a.pos-1])} pts</strong></div>):<div style={{fontSize:11,fontWeight:700,color:"#888"}}>Avulso ou fora da tabela — 0 pts</div>}
                <div style={{display:"flex",gap:3,flexWrap:"wrap",marginTop:8}}>
                  {a.tabela.map((v,i)=>(<span key={i} style={{background:i===a.pos-1?"#000":"#e5e5e5",color:i===a.pos-1?"#7C6FF7":"#555",border:"2px solid #000",borderRadius:2,padding:"2px 5px",fontSize:9,fontWeight:900}}>{i+1}°={fmtPts(v)}</span>))}
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:10,fontWeight:900,color:"#555"}}>RANKING:</span>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{textAlign:"center"}}><div style={{fontSize:9,fontWeight:700,color:"#888"}}>antes</div><span style={nb.tag("#e5e5e5")}>{a.rankBefore||"—"}°</span><div style={{fontSize:9,fontWeight:700,color:"#888"}}>{fmtPts(a.ptsBefore)} pts</div></div>
                  <span style={{fontSize:18,fontWeight:900,color:a.delta>0?"#059669":a.delta<0?"#dc2626":"#888"}}>{a.delta>0?"↑":a.delta<0?"↓":"→"}</span>
                  <div style={{textAlign:"center"}}><div style={{fontSize:9,fontWeight:700,color:"#888"}}>depois</div><span style={nb.tag(a.delta>0?"#4FC9A4":a.delta<0?"#F97B6B":"#e5e5e5")}>{a.rankAfter||"—"}°</span><div style={{fontSize:9,fontWeight:700,color:"#888"}}>{fmtPts(a.ptsAfter)} pts</div></div>
                  {a.delta!==0?<span style={{...nb.tag(a.delta>0?"#4FC9A4":"#F97B6B"),marginLeft:4}}>{a.delta>0?`+${a.delta} pos`:a.delta+" pos"}</span>:<span style={{...nb.tag("#e5e5e5"),marginLeft:4}}>sem mudanca</span>}
                </div>
              </div>
            </div>)}
          </div>))}
          {(sess.ausentes||[]).length>0&&filterPlayer==="todos"&&(<div style={{...nb.cardSm("#FBBF24"),marginTop:4}}><span style={{fontWeight:900,fontSize:11}}>Faltaram: {(sess.ausentes||[]).join(", ")} — cada um paga R$40, recebe 0 pts, ranking congelado</span></div>)}
          <div style={{marginTop:12,display:"flex",justifyContent:"flex-end"}}>
            <button style={nb.btn(copied===sess.id?"#4FC9A4":"#25D366")} onClick={()=>copiar(sess,idx)}>
              {copied===sess.id?"✓ Copiado!":"⎘ Copiar auditoria (WhatsApp)"}
            </button>
          </div>
        </div>)}
      </div>);
    })}
  </div>);
}

// ── PAGE: TIMER ─────────────────────────────────────────────
function PageTimer({timer,onUpdate}){
  const ts=timer||TIMER_INIT;
  const [cd,setCd]=useState(0);
  const [nowStr,setNowStr]=useState("");
  const [soundOn,setSoundOn]=useState(false);
  const [flash,setFlash]=useState(false);
  const tsRef=React.useRef(ts);
  const upRef=React.useRef(onUpdate);
  const sndRef=React.useRef(false);
  const audioRef=React.useRef(null);
  const warnRef=React.useRef(-1);
  const lvlupRef=React.useRef(-1);
  useEffect(()=>{tsRef.current=ts;},[ts]);
  useEffect(()=>{upRef.current=onUpdate;},[onUpdate]);
  useEffect(()=>{sndRef.current=soundOn;},[soundOn]);

  // ── RECALIBRAÇÃO REATIVA ─────────────────────────────────
  // Roda toda vez que status ou level muda.
  // Corrige o timer para o nível correto pelo horário real de Brasília.
  // Só atua na fase pré-intervalo (níveis 0-8).
  // Após o intervalo (level>=9), o timer roda livre (retomada manual).
  useEffect(()=>{
    if(ts.status==="paused"||ts.status==="finished")return;
    if(ts.level>=9)return; // após intervalo, não interferir
    const br=getBR();
    if(br.hm<1170)return; // antes das 19:30
    const elap=br.totalSecs-(19*3600+30*60);
    if(elap<0)return;
    let acc=0,target=null;
    for(let i=0;i<=8;i++){
      const bl=BLIND_STRUCTURE[i];
      if(bl.isBreak){target={status:"break",level:i,levelStartedAt:null};break;}
      if(elap<acc+bl.dur){target={status:"running",level:i,levelStartedAt:Date.now()-(elap-acc)*1000};break;}
      acc+=bl.dur;
    }
    if(!target)target={status:"break",level:8,levelStartedAt:null};
    // Só escreve se o estado atual está errado
    if(ts.status!==target.status||ts.level!==target.level){
      onUpdate(p=>({...p,timer:target}));
    }
  },[ts.status,ts.level]);

  const lvl=BLIND_STRUCTURE[ts.level]||BLIND_STRUCTURE[0];
  const nextLvl=BLIND_STRUCTURE[ts.level+1];
  const totalPlay=BLIND_STRUCTURE.filter(l=>!l.isBreak).length;
  const currPlay=BLIND_STRUCTURE.slice(0,ts.level+1).filter(l=>!l.isBreak).length;

  const getBR=()=>{
    const n=new Date();
    let h=n.getUTCHours()-3;if(h<0)h+=24;
    const m=n.getUTCMinutes(),s=n.getUTCSeconds();
    return{h,m,s,hm:h*60+m,totalSecs:h*3600+m*60+s,
      str:`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`};
  };
  const fmtCD=s=>{const v=Math.max(0,Math.ceil(s));return`${String(Math.floor(v/60)).padStart(2,"0")}:${String(v%60).padStart(2,"0")}`;};
  const fmtB=l=>l&&!l.isBreak?`${(l.sb||0).toLocaleString("pt-BR")} / ${(l.bb||0).toLocaleString("pt-BR")}` :"";

  const beep=(f,d,v=0.5)=>{
    if(!sndRef.current)return;
    try{
      if(!audioRef.current)audioRef.current=new(window.AudioContext||window.webkitAudioContext)();
      const c=audioRef.current,o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(v,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
      o.start();o.stop(c.currentTime+d);
    }catch(e){}
  };
  const chime=()=>{[[523,0],[659,220],[784,440]].forEach(([f,t])=>setTimeout(()=>beep(f,0.25,0.7),t));};

  const advance=(t)=>{
    const ni=t.level+1;
    if(ni>=BLIND_STRUCTURE.length){upRef.current(p=>({...p,timer:{status:"finished",level:t.level,levelStartedAt:null}}));return;}
    chime();
    const nl=BLIND_STRUCTURE[ni];
    upRef.current(p=>({...p,timer:nl.isBreak
      ?{status:"break",level:ni,levelStartedAt:null}
      :{status:"running",level:ni,levelStartedAt:Date.now()}}));
  };

  useEffect(()=>{
    const tick=()=>{
      const t=tsRef.current;
      const l=BLIND_STRUCTURE[t.level]||BLIND_STRUCTURE[0];
      const br=getBR();
      setNowStr(br.str);
      if(t.status==="running"&&t.levelStartedAt){
        if(l.isLast||!l.dur){setCd(0);return;}
        const rem=Math.max(0,l.dur-(Date.now()-t.levelStartedAt)/1000);
        setCd(rem);
        if(rem<=60&&rem>0&&warnRef.current!==t.level){warnRef.current=t.level;beep(880,0.25,0.5);}
        if(rem<=0&&lvlupRef.current!==t.level){lvlupRef.current=t.level;advance(t);}
      }else if(t.status==="paused"){
        setCd(t.pausedSecs||0);
      }
    };
    const id=setInterval(tick,1000);tick();
    return()=>clearInterval(id);
  },[]);

  useEffect(()=>{
    if(ts.status==="running"&&cd>0&&cd<=30){
      const id=setInterval(()=>setFlash(f=>!f),500);
      return()=>{clearInterval(id);setFlash(false);};
    }
    setFlash(false);
  },[Math.floor(cd)<=30&&ts.status==="running"]);

  const enableSnd=()=>{
    setSoundOn(true);
    try{const c=new(window.AudioContext||window.webkitAudioContext)();audioRef.current=c;const o=c.createOscillator();o.connect(c.destination);o.start();o.stop(c.currentTime+0.001);}catch(e){}
  };
  const doStart=()=>onUpdate(p=>({...p,timer:{status:"running",level:0,levelStartedAt:Date.now()}}));
  const doRetomar=()=>{const ni=ts.level+1;if(ni<BLIND_STRUCTURE.length){chime();onUpdate(p=>({...p,timer:{status:"running",level:ni,levelStartedAt:Date.now()}}));}};
  const doPause=()=>{
    if(ts.status==="running")onUpdate(p=>({...p,timer:{...ts,status:"paused",pausedSecs:Math.ceil(cd)}}));
    else if(ts.status==="paused"){const l=BLIND_STRUCTURE[ts.level];onUpdate(p=>({...p,timer:{...ts,status:"running",levelStartedAt:Date.now()-((l.dur-(ts.pausedSecs||0))*1000)}}));}
  };
  const doNext=()=>advance(ts);
  const doPrev=()=>{
    if(ts.level<=0)return;
    const pi=ts.level-1,pl=BLIND_STRUCTURE[pi];
    onUpdate(p=>({...p,timer:pl.isBreak?{status:"break",level:pi,levelStartedAt:null}:{status:"running",level:pi,levelStartedAt:Date.now()}}));
  };
  const doReset=()=>onUpdate(p=>({...p,timer:TIMER_INIT}));
  const doRestartLvl=()=>onUpdate(p=>({...p,timer:{...ts,levelStartedAt:Date.now()}}));

  const isUrgent=cd<=30&&ts.status==="running";
  const isWarn=cd<=60&&cd>30&&ts.status==="running";
  const bgCol=flash?"#3a0000":isUrgent?"#1a0000":isWarn?"#1a1200":"#0d0d0d";
  const accent=isUrgent?"#F97B6B":isWarn?"#FBBF24":"#7C6FF7";
  const faseStr=lvl?.fase===1?"FASE 1 · 17 MIN":lvl?.fase===2?"FASE 2 · 11 MIN":lvl?.fase===3?"FASE 3 · 8 MIN":"";
  const prog=lvl.dur?Math.min(100,Math.max(0,(1-cd/lvl.dur)*100)):100;
  const btnCtrl=(bg,color="#000")=>({background:bg,border:B,borderRadius:R,boxShadow:SH_SM,color,fontSize:22,padding:"12px 16px",cursor:"pointer",fontWeight:900,minWidth:52,display:"inline-flex",alignItems:"center",justifyContent:"center"});
  const btnSec={background:"#1a1a1a",border:"2px solid #333",borderRadius:R,color:"#666",fontSize:10,padding:"6px 10px",cursor:"pointer",fontWeight:900};

  if(ts.status==="idle")return(
    <div>
      <div style={{marginBottom:20}}><div style={nb.title}>⏱ Timer de Blinds</div><div style={nb.sub}>Início automático às 19:30 · Horário de Brasília</div></div>
      <div style={{...nb.card("#0d0d0d"),marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div><div style={{color:"#555",fontSize:10,fontWeight:900,textTransform:"uppercase",letterSpacing:1}}>Brasília agora</div><div style={{color:"#fff",fontSize:26,fontWeight:900,fontFamily:"monospace",letterSpacing:2}}>{nowStr||"--:--:--"}</div></div>
        <div style={{textAlign:"right"}}><div style={{color:"#555",fontSize:10,fontWeight:900,textTransform:"uppercase",letterSpacing:1}}>Início auto</div><div style={{color:"#7C6FF7",fontSize:26,fontWeight:900}}>19:30</div></div>
      </div>
      {!soundOn&&<div style={{...nb.cardSm("#FBBF24"),marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:900}}>🔊 Habilite o som para alertas de nível</span>
        <button style={{...nb.btn("#000"),flexShrink:0}} onClick={enableSnd}><span style={{color:"#FBBF24"}}>Habilitar som</span></button>
      </div>}
      <div style={{marginBottom:16}}><button style={{...nb.btnFull("#7C6FF7"),fontSize:13}} onClick={doStart}>▶ Iniciar Agora</button></div>
      <div style={nb.card()}>
        <div style={{...nb.label,marginBottom:10}}>Estrutura de Blinds</div>
        <div style={{...nb.cardSm("#4FC9A4"),marginBottom:6}}>
          <div style={{fontWeight:900,fontSize:10,marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Fase 1 — 17 min por nível</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{BLIND_STRUCTURE.filter(l=>l.fase===1).map((l,i)=><span key={i} style={{fontSize:10,fontWeight:700,color:"#222",background:"rgba(0,0,0,0.1)",borderRadius:2,padding:"1px 5px"}}>{fmtB(l)}</span>)}</div>
        </div>
        <div style={{...nb.cardSm("#FBBF24"),marginBottom:6,textAlign:"center"}}><span style={{fontWeight:900,fontSize:12}}>🍕 INTERVALO / PIZZA</span></div>
        <div style={{...nb.cardSm("#7C6FF7"),marginBottom:6}}>
          <div style={{fontWeight:900,fontSize:10,marginBottom:4,textTransform:"uppercase",letterSpacing:1,color:"#fff"}}>Fase 2 — 11 min por nível</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{BLIND_STRUCTURE.filter(l=>l.fase===2).map((l,i)=><span key={i} style={{fontSize:10,fontWeight:700,color:"#ddd",background:"rgba(0,0,0,0.2)",borderRadius:2,padding:"1px 5px"}}>{fmtB(l)}</span>)}</div>
        </div>
        <div style={nb.cardSm("#F97B6B")}>
          <div style={{fontWeight:900,fontSize:10,marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Fase 3 — 8 min por nível</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{BLIND_STRUCTURE.filter(l=>l.fase===3).map((l,i)=><span key={i} style={{fontSize:10,fontWeight:700,color:"#222",background:"rgba(0,0,0,0.1)",borderRadius:2,padding:"1px 5px"}}>{fmtB(l)}{l.isLast?" ∞":""}</span>)}</div>
        </div>
      </div>
    </div>
  );

  if(ts.status==="break")return(
    <div>
      <div style={{...nb.card("#0d0d0d"),padding:"2.5rem 1.5rem",textAlign:"center",marginBottom:12}}>
        <div style={{fontSize:72,marginBottom:8}}>🍕</div>
        <div style={{fontSize:34,fontWeight:900,color:"#FBBF24",textTransform:"uppercase",letterSpacing:3,lineHeight:1.1,marginBottom:24}}>INTERVALO<br/>PIZZA</div>
        {nextLvl&&!nextLvl.isBreak&&<div style={{marginBottom:28}}><div style={{color:"#555",fontSize:11,fontWeight:700}}>Próximo nível</div><div style={{color:"#fff",fontSize:28,fontWeight:900,marginTop:6}}>{fmtB(nextLvl)}</div></div>}
        <button style={{...nb.btn("#4FC9A4"),fontSize:20,padding:"18px 32px",width:"100%"}} onClick={doRetomar}>▶ RETOMAR</button>
      </div>
      {!soundOn&&<div style={{...nb.cardSm("#FBBF24"),marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}><span style={{fontSize:11,fontWeight:900}}>🔊 Habilite o som</span><button style={nb.btn("#000")} onClick={enableSnd}><span style={{color:"#FBBF24"}}>Habilitar</span></button></div>}
      <button style={{...nb.btn(),width:"100%",fontSize:11}} onClick={doReset}>↺ Reiniciar tudo</button>
    </div>
  );

  if(ts.status==="finished")return(
    <div>
      <div style={{...nb.card("#0d0d0d"),padding:"2.5rem 1.5rem",textAlign:"center",marginBottom:12}}>
        <div style={{fontSize:72,marginBottom:8}}>🏆</div>
        <div style={{fontSize:26,fontWeight:900,color:"#FBBF24",textTransform:"uppercase",letterSpacing:2,marginBottom:16}}>TORNEIO ENCERRADO</div>
        <div style={{color:"#555",fontSize:11,fontWeight:700,marginBottom:4}}>Último nível em jogo</div>
        <div style={{color:"#fff",fontSize:30,fontWeight:900}}>{fmtB(BLIND_STRUCTURE[BLIND_STRUCTURE.length-1])}</div>
        <button style={{...nb.btn("#7C6FF7"),fontSize:14,padding:"12px 24px",width:"100%",marginTop:24}} onClick={doReset}>↺ Reiniciar tudo</button>
      </div>
    </div>
  );

  return(
    <div style={{
      background:bgCol,
      position:"fixed",top:0,left:0,right:0,bottom:0,
      display:"flex",flexDirection:"column",
      transition:"background 0.5s",
      fontFamily:"'Arial Black',Arial,sans-serif",
      zIndex:50,
      overflow:"hidden"
    }}>

      {/* ── TOPO: fase + nível + relógio ── */}
      <div style={{
        display:"flex",alignItems:"center",justifyContent:"space-between",
        padding:"18px 24px 0"
      }}>
        <div>
          <div style={{color:accent,fontSize:11,fontWeight:900,textTransform:"uppercase",letterSpacing:3,marginBottom:2}}>{faseStr}</div>
          <div style={{color:"#bbb",fontSize:14,fontWeight:700}}>Nível {currPlay} de {totalPlay}</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{color:"#333",fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>Brasília</div>
          <div style={{color:"#555",fontSize:14,fontWeight:900,fontFamily:"monospace",letterSpacing:1}}>{nowStr}</div>
        </div>
      </div>

      {/* ── CENTRO: blinds + countdown ── */}
      <div style={{
        flex:1,display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"center",
        padding:"0 20px"
      }}>
        {/* Blinds */}
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{color:"#444",fontSize:11,fontWeight:900,textTransform:"uppercase",letterSpacing:5,marginBottom:10}}>SB / BB</div>
          <div style={{
            color:"#fff",
            fontSize:"clamp(42px,12vw,80px)",
            fontWeight:900,
            lineHeight:1,
            letterSpacing:-1
          }}>{fmtB(lvl)}</div>
        </div>

        {/* Countdown */}
        <div style={{
          color:accent,
          fontSize:"clamp(96px,28vw,160px)",
          fontWeight:900,
          lineHeight:0.9,
          letterSpacing:4,
          transition:"color 0.3s",
          textAlign:"center"
        }}>
          {lvl.isLast?"∞":fmtCD(cd)}
        </div>

        {ts.status==="paused"&&(
          <div style={{
            marginTop:12,
            color:"#FBBF24",fontSize:13,fontWeight:900,
            textTransform:"uppercase",letterSpacing:4,
            border:"2px solid #FBBF24",borderRadius:4,
            padding:"4px 16px"
          }}>⏸ PAUSADO</div>
        )}
      </div>

      {/* ── BARRA DE PROGRESSO ── */}
      {!lvl.isLast&&(
        <div style={{padding:"0 24px 6px"}}>
          <div style={{height:10,background:"#1c1c1c",borderRadius:5,overflow:"hidden",border:"1px solid #2a2a2a"}}>
            <div style={{height:"100%",width:`${prog}%`,background:accent,borderRadius:5,transition:"width 1s linear"}}/>
          </div>
        </div>
      )}

      {/* ── PRÓXIMO NÍVEL ── */}
      <div style={{textAlign:"center",padding:"6px 24px 12px",minHeight:28}}>
        {nextLvl&&!nextLvl.isBreak&&(
          <span style={{color:"#888",fontSize:15,fontWeight:700}}>
            Próximo: <span style={{color:"#bbb",fontWeight:900}}>{fmtB(nextLvl)}</span>
          </span>
        )}
        {nextLvl?.isBreak&&<span style={{color:"#FBBF24",fontSize:15,fontWeight:900}}>🍕 Próximo: INTERVALO</span>}
        {!nextLvl&&<span style={{color:"#4FC9A4",fontSize:15,fontWeight:900}}>🏆 Último nível</span>}
      </div>

      {/* ── CONTROLES PRINCIPAIS ── */}
      <div style={{display:"flex",gap:12,justifyContent:"center",padding:"0 24px 10px"}}>
        <button onClick={doPrev} style={{
          background:"#1a1a1a",border:"3px solid #2a2a2a",borderRadius:10,
          color:"#555",fontSize:26,padding:"16px 0",cursor:"pointer",
          fontWeight:900,width:80,boxShadow:"2px 2px 0 #000",
          display:"flex",alignItems:"center",justifyContent:"center"
        }}>↩</button>

        <button onClick={doPause} style={{
          background:ts.status==="paused"?"#4FC9A4":"#FBBF24",
          border:"3px solid #000",borderRadius:10,
          color:"#000",fontSize:32,padding:"16px 0",cursor:"pointer",
          fontWeight:900,flex:1,maxWidth:180,boxShadow:"3px 3px 0 #000",
          display:"flex",alignItems:"center",justifyContent:"center"
        }}>
          {ts.status==="paused"?"▶":"⏸"}
        </button>

        <button onClick={doNext} style={{
          background:"#1a1a1a",border:"3px solid #2a2a2a",borderRadius:10,
          color:"#555",fontSize:26,padding:"16px 0",cursor:"pointer",
          fontWeight:900,width:80,boxShadow:"2px 2px 0 #000",
          display:"flex",alignItems:"center",justifyContent:"center"
        }}>⏭</button>
      </div>

      {/* ── CONTROLES SECUNDÁRIOS ── */}
      <div style={{
        display:"flex",gap:8,justifyContent:"center",
        padding:"0 24px 28px",flexWrap:"wrap"
      }}>
        {[
          {label:"↺ Nível",fn:doRestartLvl,color:"#555"},
          {label:"⏹ Resetar",fn:doReset,color:"#555"},
          {label:soundOn?"🔊 Som":"🔇 Som",fn:soundOn?()=>setSoundOn(false):enableSnd,color:soundOn?"#4FC9A4":"#555"},
        ].map(({label,fn,color})=>(
          <button key={label} onClick={fn} style={{
            background:"#111",border:"1px solid #2a2a2a",borderRadius:8,
            color,fontSize:12,padding:"10px 16px",cursor:"pointer",
            fontWeight:900,letterSpacing:0.5
          }}>{label}</button>
        ))}
      </div>
    </div>
  );
}

}

// ── APP ROOT ───────────────────────────────────────────────
function App(){
  const [mode,setMode]=useState("guest");
  const [page,setPage]=useState("home");
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [showLogin,setShowLogin]=useState(false);

  useEffect(()=>{(async()=>{const r=await fbGet();if(r&&r.sessions)setData(r);else{const d=defaultState();setData(d);await fbSet(d);}setLoading(false);})();},[]);

  useEffect(()=>{
    if(page!=="timer")return;
    const poll=setInterval(async()=>{const r=await fbGet();if(r?.timer)setData(prev=>({...prev,timer:r.timer}));},5000);
    return()=>clearInterval(poll);
  },[page]);

  const update=async patch=>{
    setSaving(true);
    setData(prev=>{const next=typeof patch==="function"?patch(prev):{...prev,...patch};fbSet(next).then(()=>setSaving(false));return next;});
  };

  const handleEditSession=updated=>{
    update(prev=>{
      const oldSess=prev.sessions.find(s=>s.id===updated.id);
      const oldPFV=oldSess?.poteFinalVal||0;
      const sessions=prev.sessions.map(s=>s.id===updated.id?updated:s);
      const poteFinal=prev.poteFinal-oldPFV+updated.poteFinalVal;
      return{...prev,sessions,poteFinal};
    });
  };

  if(loading)return(<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",flexDirection:"column",gap:16,background:BG}}><div style={{width:40,height:40,border:"3px solid #000",borderTop:"3px solid #7C6FF7",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/><div style={{fontWeight:900,textTransform:"uppercase",letterSpacing:2}}>Carregando...</div></div>);
  if(showLogin)return <Login onLogin={()=>{setMode("admin");setShowLogin(false);}} onBack={()=>setShowLogin(false)}/>;

  const {sessions,players,poteFinal,historico=[],temporada=2026}=data;
  const standings=calcStandings(sessions,players);
  const balance=calcBalance(sessions,players);
  const isAdmin=mode==="admin";

  const PAGES=[
    {id:"home",label:"Dashboard",icon:"◈"},{id:"classificacao",label:"Classificação",icon:"◎"},
    {id:"saldo",label:"Saldo",icon:"◐"},{id:"acerto",label:"Acerto",icon:"◑"},
    {id:"partidas",label:"Partidas",icon:"◫"},{id:"pote",label:"Pote Final",icon:"◉"},
    {id:"campeoes",label:"Campeões",icon:"★"},{id:"jogadores",label:"Jogadores",icon:"◍"},
    {id:"auditoria",label:"Auditoria",icon:"◧"},{id:"timer",label:"Timer",icon:"⏱"},
    {id:"cuia",label:"CuIA",icon:"🤖"},
    ...(isAdmin?[{id:"nova",label:"Nova Partida",icon:"⊕"},{id:"temporada",label:"Nova Temporada",icon:"↺"}]:[]),
  ];

  return(<div style={{display:"flex",minHeight:"100vh",background:BG,fontFamily:"'Arial Black',Arial,sans-serif",color:"#000",fontSize:13}}>
    <aside className="sidebar" style={{width:215,flexShrink:0,background:"#000",borderRight:B,display:"flex",flexDirection:"column",position:"sticky",top:0,height:"100vh",overflow:"hidden"}}>
      <div style={{padding:"14px 14px 10px",borderBottom:"3px solid #333",flexShrink:0}}>
        <div style={{background:"#111",border:"3px solid #333",borderRadius:R,padding:"10px",marginBottom:8,textAlign:"center",boxShadow:"3px 3px 0 #333"}}>
          <div style={{fontSize:16,fontWeight:900,letterSpacing:3,color:"#fff",textTransform:"uppercase"}}>POKER</div>
          <div style={{display:"flex",justifyContent:"center",gap:5,margin:"4px 0"}}>
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402C1 3.335 3.74 1 7 1c1.997 0 3.726 1.04 5 2.268C13.274 2.04 15.003 1 17 1c3.26 0 6 2.335 6 6.191 0 4.105-5.37 8.863-11 14.402z" fill="#7C6FF7"/></svg>
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2L8 8H2l5 4-2 6 7-4 7 4-2-6 5-4h-6z" fill="#4FC9A4"/></svg>
            <svg width="12" height="14" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2" fill="#F97B6B" transform="rotate(45 12 12)"/></svg>
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2C9 2 7 4 7 6.5c0 1.5.7 2.8 1.8 3.7C6.5 10.8 5 12.5 5 14.5 5 17 7 19 9.5 19c1 0 2-.4 2.5-1v3h1v-3c.5.6 1.5 1 2.5 1C18 19 20 17 20 14.5c0-2-1.5-3.7-3.8-4.3C17.3 9.3 18 8 18 6.5 18 4 16 2 13 2h-1z" fill="#FBBF24"/></svg>
          </div>
          <div style={{fontSize:10,fontWeight:900,letterSpacing:3,color:"#fff",textTransform:"uppercase"}}>DO BULLYING</div>
        </div>
        <div style={{textAlign:"center",color:"#555",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>Temporada {temporada}</div>
      </div>
      <nav style={{flex:1,padding:"8px 0",overflowY:"auto"}}>
        {PAGES.map((p,i)=>{const accent=NAV_ACCENT[i%NAV_ACCENT.length];const active=page===p.id;return(<button key={p.id} onClick={()=>setPage(p.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 14px",fontSize:11,cursor:"pointer",border:"none",borderLeft:`4px solid ${active?accent:"transparent"}`,background:active?accent+"33":"transparent",width:"100%",textAlign:"left",color:active?"#fff":"#888",fontWeight:900,textTransform:"uppercase",letterSpacing:0.5}}><span style={{fontSize:13}}>{p.icon}</span>{p.label}</button>);})}
      </nav>
      <div style={{padding:"10px 14px",borderTop:"3px solid #333",flexShrink:0}}>
        {saving&&<div style={{...nb.tag("#FBBF24"),marginBottom:8,fontSize:9}}>Salvando...</div>}
        {isAdmin
          ?<div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}><div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:24,height:24,borderRadius:"50%",background:"#7C6FF7",border:"2px solid #fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:900,color:"#fff"}}>TI</div><span style={{fontSize:10,color:"#fff",fontWeight:900}}>tiagoirber</span></div><button style={{...nb.btn("#F97B6B"),padding:"3px 8px",fontSize:10}} onClick={()=>{setMode("guest");setPage("home");}}>Sair</button></div>
          :<button style={{...nb.btnFull("#7C6FF7"),color:"#000"}} onClick={()=>setShowLogin(true)}>▶ Admin</button>
        }
      </div>
    </aside>
    <main className="main-content" style={{flex:1,padding:"1.5rem",overflowY:"auto",minWidth:0,paddingBottom:"7rem"}}>
      {page==="home"&&<PageHome sessions={sessions} poteFinal={poteFinal} standings={standings} balance={balance} temporada={temporada} setPage={setPage}/>}
      {page==="classificacao"&&<PageClassificacao standings={standings} sessions={sessions}/>}
      {page==="saldo"&&<PageSaldo sessions={sessions} players={players}/>}
      {page==="acerto"&&<PageAcerto sessions={sessions}/>}
      {page==="partidas"&&<PagePartidas sessions={sessions} isAdmin={isAdmin} onDelete={id=>{update(prev=>{const s=prev.sessions.find(x=>x.id===id);return{...prev,sessions:prev.sessions.filter(x=>x.id!==id),poteFinal:Math.max(0,prev.poteFinal-(s?.poteFinalVal||0))};});}} onEdit={handleEditSession}/>}
      {page==="pote"&&<PagePote poteFinal={poteFinal} isAdmin={isAdmin} onEdit={v=>update(prev=>({...prev,poteFinal:v}))}/>}
      {page==="campeoes"&&<PageCampeoes standings={standings} poteFinal={poteFinal} historico={historico} temporada={temporada}/>}
      {page==="jogadores"&&<PageJogadores players={players} isAdmin={isAdmin} onAdd={name=>update(prev=>({...prev,players:[...prev.players,name]}))}/>}
      {page==="auditoria"&&<PageAuditoria sessions={sessions} players={players}/>}
      {page==="timer"&&<PageTimer timer={data.timer} onUpdate={update}/>}
      {page==="cuia"&&<PageCuia/>}
      {page==="nova"&&isAdmin&&<PageNova players={players} onSave={sess=>{update(prev=>({...prev,sessions:[...prev.sessions,sess],poteFinal:prev.poteFinal+(sess.poteFinalVal||0)}));setPage("partidas");}}/>}
      {page==="temporada"&&isAdmin&&<PageTemporada data={data} standings={standings} poteFinal={poteFinal} onConfirm={novoState=>{update(()=>novoState);setPage("home");}}/>}
    </main>

    {/* ── MOBILE BOTTOM NAV ── */}
    <nav className="mobile-nav" style={{display:"none",position:"fixed",bottom:0,left:0,right:0,background:"#000",borderTop:B,zIndex:100,overflowX:"scroll",WebkitOverflowScrolling:"touch"}}>
      <div style={{display:"flex",flexDirection:"row",width:"max-content",minWidth:"100%"}}>
        {PAGES.map((p,i)=>{
          const accent=NAV_ACCENT[i%NAV_ACCENT.length];
          const active=page===p.id;
          const isAdminPage=p.id==="nova"||p.id==="temporada";
          return(<button key={p.id} onClick={()=>setPage(p.id)} style={{display:"inline-flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,padding:"14px 18px",fontSize:10,cursor:"pointer",border:"none",borderTop:`3px solid ${active?accent:isAdminPage?"#333":"transparent"}`,background:active?accent+"33":isAdminPage?"#111":"transparent",color:active?"#fff":isAdminPage?"#aaa":"#666",fontWeight:900,textTransform:"uppercase",letterSpacing:0.3,minWidth:68,flexShrink:0}}>
            <span style={{fontSize:20}}>{p.icon}</span>
            <span style={{fontSize:10,whiteSpace:"nowrap"}}>{p.label}</span>
          </button>);
        })}
        {isAdmin&&<button onClick={()=>{setMode("guest");setPage("home");}} style={{display:"inline-flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,padding:"14px 18px",fontSize:10,cursor:"pointer",border:"none",borderTop:"3px solid #F97B6B",background:"#1a0000",color:"#F97B6B",fontWeight:900,textTransform:"uppercase",letterSpacing:0.3,minWidth:68,flexShrink:0}}><span style={{fontSize:20}}>✕</span><span style={{fontSize:10}}>Sair</span></button>}
      </div>
    </nav>

    {/* ── MOBILE ADMIN BUTTON ── */}
    {!isAdmin&&<button className="mobile-admin-btn" onClick={()=>setShowLogin(true)} style={{display:"none",position:"fixed",bottom:70,right:16,width:44,height:44,background:"#7C6FF7",border:B,borderRadius:"50%",boxShadow:SH,cursor:"pointer",fontSize:16,fontWeight:900,zIndex:101,alignItems:"center",justifyContent:"center"}}>▶</button>}
    {isAdmin&&<button className="mobile-admin-btn" onClick={()=>setPage("nova")} style={{display:"none",position:"fixed",bottom:70,right:16,width:52,height:52,background:"#4FC9A4",border:B,borderRadius:R,boxShadow:SH,cursor:"pointer",fontSize:11,fontWeight:900,zIndex:101,alignItems:"center",justifyContent:"center",flexDirection:"column",gap:2,textTransform:"uppercase",letterSpacing:0.5}}><span style={{fontSize:18}}>⊕</span><span style={{fontSize:8}}>Nova</span></button>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
